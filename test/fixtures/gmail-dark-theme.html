<!DOCTYPE html>
<!-- Fake Gmail using a plain dark theme, like Gmail's own "Dark" theme. -->
<html>
  <head>
    <meta charset="utf-8">
    <title>Inbox - Fake Gmail</title>
    <style>
      html, body { height: 100%; }
      body { margin: 0; background: #1f1f1f; color: #e8eaed; font: 14px sans-serif; }
      .row { padding: 8px 16px; }
    </style>
  </head>
  <body>
    <div role="main">
      <div class="row">Your weekly newsletter</div>
      <div class="row">Meeting notes</div>
    </div>
  </body>
</html>
